[build]
  publish = "_site"
  command = "rm -rf js && npx tailwindcss -i ./src/css/input.css -o ./src/css/style.css && eleventy"
  functions = "functions"

# Redirects and headers
[[redirects]]
  from = "/documentation/internal/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/todo.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/optimize_images.sh"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/resize_images.sh"
  to = "/404.html"
  status = 404

# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"


[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

