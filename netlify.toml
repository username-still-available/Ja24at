[build]
  publish = "_site"
  command = "npm install && npm run netlify # Updated build command"
  functions = "functions"

# Redirects and headers
[[redirects]]
  from = "/documentation/internal/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/todo.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/optimize_images.sh"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/resize_images.sh"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = true
  conditions = {Protocol = ["http"]}

# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google-analytics.com https://www.googletagmanager.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://identity.netlify.com; frame-src https://www.google.com/recaptcha/ https://identity.netlify.com; object-src 'none'; base-uri 'self';"

# Force browsers to not cache CSS and images
[[headers]]
  for = "/*.(css|jpg|jpeg|png|webp|svg)"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Also force no cache on the main stylesheet specifically
[[headers]]
  for = "/css/style.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

