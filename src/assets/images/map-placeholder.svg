<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#F2F2F0"/>
  
  <!-- Map grid with more streets for realism -->
  <g stroke="#E0E0E0" stroke-width="1">
    <!-- Vertical streets -->
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    
    <!-- Horizontal streets -->
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="250" x2="600" y2="250" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="350" x2="600" y2="350" />
  </g>
  
  <!-- Main streets -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <path d="M50,100 L550,100" />
    <path d="M100,50 L100,350" />
    <path d="M300,50 L300,350" />
    <path d="M500,50 L500,350" />
    <path d="M50,200 L550,200" />
    <path d="M50,300 L550,300" />
  </g>
  
  <!-- Secondary streets -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <path d="M150,50 L150,350" />
    <path d="M200,50 L200,350" />
    <path d="M250,50 L250,350" />
    <path d="M350,50 L350,350" />
    <path d="M400,50 L400,350" />
    <path d="M450,50 L450,350" />
    <path d="M50,150 L550,150" />
    <path d="M50,250 L550,250" />
  </g>
  
  <!-- Buildings (blocks) -->
  <g fill="#E8E8E8" stroke="#D8D8D8" stroke-width="1">
    <!-- Row 1 -->
    <rect x="60" y="60" width="30" height="30" />
    <rect x="110" y="60" width="30" height="30" />
    <rect x="160" y="60" width="30" height="30" />
    <rect x="210" y="60" width="30" height="30" />
    <rect x="260" y="60" width="30" height="30" />
    <rect x="310" y="60" width="30" height="30" />
    <rect x="360" y="60" width="30" height="30" />
    <rect x="410" y="60" width="30" height="30" />
    <rect x="460" y="60" width="30" height="30" />
    <rect x="510" y="60" width="30" height="30" />
    
    <!-- Row 2 -->
    <rect x="60" y="110" width="30" height="30" />
    <rect x="110" y="110" width="30" height="30" />
    <rect x="160" y="110" width="30" height="30" />
    <rect x="210" y="110" width="30" height="30" />
    <rect x="260" y="110" width="30" height="30" />
    <rect x="310" y="110" width="30" height="30" />
    <rect x="360" y="110" width="30" height="30" />
    <rect x="410" y="110" width="30" height="30" />
    <rect x="460" y="110" width="30" height="30" />
    <rect x="510" y="110" width="30" height="30" />
    
    <!-- Row 3 -->
    <rect x="60" y="160" width="30" height="30" />
    <rect x="110" y="160" width="30" height="30" />
    <rect x="160" y="160" width="30" height="30" />
    <rect x="210" y="160" width="30" height="30" />
    <rect x="260" y="160" width="30" height="30" />
    <!-- Special building for Tuchlauben 7 -->
    <rect x="310" y="160" width="30" height="30" fill="#C8E6C9" stroke="#0A4835" stroke-width="2" />
    <rect x="360" y="160" width="30" height="30" />
    <rect x="410" y="160" width="30" height="30" />
    <rect x="460" y="160" width="30" height="30" />
    <rect x="510" y="160" width="30" height="30" />
    
    <!-- Row 4 -->
    <rect x="60" y="210" width="30" height="30" />
    <rect x="110" y="210" width="30" height="30" />
    <rect x="160" y="210" width="30" height="30" />
    <rect x="210" y="210" width="30" height="30" />
    <rect x="260" y="210" width="30" height="30" />
    <rect x="310" y="210" width="30" height="30" />
    <rect x="360" y="210" width="30" height="30" />
    <rect x="410" y="210" width="30" height="30" />
    <rect x="460" y="210" width="30" height="30" />
    <rect x="510" y="210" width="30" height="30" />
    
    <!-- Row 5 -->
    <rect x="60" y="260" width="30" height="30" />
    <rect x="110" y="260" width="30" height="30" />
    <rect x="160" y="260" width="30" height="30" />
    <rect x="210" y="260" width="30" height="30" />
    <rect x="260" y="260" width="30" height="30" />
    <rect x="310" y="260" width="30" height="30" />
    <rect x="360" y="260" width="30" height="30" />
    <rect x="410" y="260" width="30" height="30" />
    <rect x="460" y="260" width="30" height="30" />
    <rect x="510" y="260" width="30" height="30" />
    
    <!-- Row 6 -->
    <rect x="60" y="310" width="30" height="30" />
    <rect x="110" y="310" width="30" height="30" />
    <rect x="160" y="310" width="30" height="30" />
    <rect x="210" y="310" width="30" height="30" />
    <rect x="260" y="310" width="30" height="30" />
    <rect x="310" y="310" width="30" height="30" />
    <rect x="360" y="310" width="30" height="30" />
    <rect x="410" y="310" width="30" height="30" />
    <rect x="460" y="310" width="30" height="30" />
    <rect x="510" y="310" width="30" height="30" />
  </g>
  
  <!-- Parks (green areas) -->
  <g fill="#C8E6C9" stroke="#A5D6A7" stroke-width="1">
    <rect x="60" y="210" width="80" height="40" rx="5" />
    <rect x="410" y="110" width="80" height="80" rx="5" />
    <circle cx="485" cy="310" r="25" />
  </g>
  
  <!-- Water feature (small pond) -->
  <ellipse cx="160" cy="310" rx="40" ry="25" fill="#B3E5FC" stroke="#81D4FA" stroke-width="1" />
  
  <!-- Location pin at Tuchlauben 7 (special building highlighted above) -->
  <g transform="translate(325, 175)">
    <!-- Pin shadow -->
    <ellipse cx="0" cy="20" rx="10" ry="5" fill="rgba(0,0,0,0.3)" />
    
    <!-- Pin -->
    <path d="M0,-30 C-15,-30 -20,-15 -20,0 C-20,15 0,30 0,30 C0,30 20,15 20,0 C20,-15 15,-30 0,-30 Z" fill="#0A4835" />
    
    <!-- Pin center -->
    <circle cx="0" cy="0" r="8" fill="white" />
  </g>
  
  <!-- Street Labels -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">
    <text x="325" y="115" transform="rotate(-10, 325, 115)">Tuchlauben</text>
    <text x="250" y="185" transform="rotate(0, 250, 185)">Bognergasse</text>
    <text x="400" y="185" transform="rotate(0, 400, 185)">Kohlmarkt</text>
    <text x="325" y="285" transform="rotate(-10, 325, 285)">Graben</text>
  </g>
  
  <!-- Landmark Labels -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#333333">
    <text x="420" y="140">Hofburg</text>
    <text x="100" y="235">Stadtpark</text>
    <text x="160" y="300">Stadtteich</text>
  </g>
  
  <!-- District Label -->
  <text x="50" y="380" font-family="Arial, sans-serif" font-size="14" fill="#4B5563" font-weight="bold">Wien - 1. Bezirk (Innere Stadt)</text>
  
  <!-- Location Label -->
  <text x="325" y="145" font-family="Arial, sans-serif" font-size="9" fill="#0A4835" font-weight="bold">Goldenes Quartier</text>
  
  <!-- Scale and Compass -->
  <g transform="translate(530, 350)">
    <!-- Compass -->
    <circle cx="0" cy="0" r="15" fill="white" stroke="#666" stroke-width="1" />
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#666" stroke-width="1" />
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#666" stroke-width="1" />
    <text x="0" y="-7" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">N</text>
    <text x="7" y="0" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">E</text>
    <text x="0" y="9" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">S</text>
    <text x="-7" y="0" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">W</text>
  </g>
  
  <!-- Scale bar -->
  <g transform="translate(50, 350)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#666" stroke-width="2" />
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#666" stroke-width="2" />
    <line x1="100" y1="-3" x2="100" y2="3" stroke="#666" stroke-width="2" />
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">100 m</text>
  </g>
  
  <!-- Copyright notice -->
  <text x="300" y="390" font-family="Arial, sans-serif" font-size="8" fill="#4B5563" opacity="0.7" text-anchor="middle">© 24ja.at | Tuchlauben 7/A, 1010 Wien</text>
</svg> 